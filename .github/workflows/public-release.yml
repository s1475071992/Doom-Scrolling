name: Publish public APK v1.9.0-rc.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  public-release:
    if: contains(github.event.head_commit.message, '[publish v1.9.0-rc.1]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the exact published commit
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Download versioned official gesture model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --output app/src/main/assets/gesture_recognizer.task \
            https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task
          test -s app/src/main/assets/gesture_recognizer.task
      - name: Unit tests, lint and assemble public preview APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify signature, prepare APK and SHA256
        shell: bash
        run: |
          set -euxo pipefail
          ASSET="Doom-Scrolling-v1.9.0-rc.1-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$ASSET"
          sha256sum "$ASSET" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create public GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          TAG="v1.9.0-rc.1"
          ASSET="Doom-Scrolling-v1.9.0-rc.1-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ASSET" SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "隔空手势 v1.9.0-rc.1 · 公开候选版" \
              --notes-file RELEASE_NOTES_V1_9_0_RC1.md \
              --prerelease
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets
