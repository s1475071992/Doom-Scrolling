name: Android debug APK

on:
  push:
    branches: [main, release/v1.9.0-rc.1-hardening, experiment/ai-auto-acceleration-v110]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Download official MediaPipe Gesture Recognizer
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --output app/src/main/assets/gesture_recognizer.task \
            https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task
          test -s app/src/main/assets/gesture_recognizer.task
      - name: Inspect official task bundle and NPU experimental inputs
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m unittest discover -s tools/tests -v
          python3 tools/extract_mediapipe_submodels.py \
            app/src/main/assets/gesture_recognizer.task app/src/main/assets
          curl --fail --location --retry 3 \
            -o /tmp/litert_npu_jit.zip \
            https://github.com/google-ai-edge/LiteRT/releases/download/v2.2.0/litert_npu_runtime_libraries_jit.zip
          echo 'd6d160104f110e690f1c9b0c54ab3855af1a12e405dcc6e644dd7e3e1955aac4  /tmp/litert_npu_jit.zip' \
            | sha256sum --check
          unzip -Z1 /tmp/litert_npu_jit.zip | grep -E 'mediatek_runtime|qualcomm_runtime_v'
          # Experimental APK includes actual vendor dispatcher/compiler plugins.
          # Qualcomm-specific QNN/HTP runtime and every other Hexagon variant
          # still require separately licensed/vendor-matched distribution.
          python3 tools/install_npu_jit_plugins.py \
            /tmp/litert_npu_jit.zip app/src/main/jniLibs/arm64-v8a
      - name: Test, Android Lint and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Print Lint failures for experimental compatibility audit
        if: failure()
        shell: bash
        run: |
          if test -f app/build/reports/lint-results-debug.txt; then
            grep -n -A 3 -E '^.*Error:' app/build/reports/lint-results-debug.txt | head -240 || true
          fi
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Doom-Scrolling-gesture-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
